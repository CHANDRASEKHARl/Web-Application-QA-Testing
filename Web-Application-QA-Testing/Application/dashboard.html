<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard for the Web Application QA Testing Project." />
    <title>Web Application QA Testing Project | Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-page" data-protected-page>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="dashboard.html" aria-label="Web Application QA Testing Project dashboard">
          <span class="brand-mark" aria-hidden="true">QA</span>
          <span>Web Application QA Testing Project</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link active" href="dashboard.html" aria-current="page">Dashboard</a>
          <a class="nav-link" href="profile.html">Profile</a>
          <button id="logout-button" class="button button-quiet" type="button">Log out</button>
        </nav>
      </div>
    </header>

    <main class="content-shell">
      <section class="welcome-section" aria-labelledby="welcome-title">
        <p class="eyebrow">Dashboard</p>
        <h1 id="welcome-title">Welcome, <span id="welcome-name">User</span>.</h1>
        <p>Your account is signed in and ready for testing.</p>
        <div id="dashboard-message" class="message" role="status" aria-live="polite" hidden></div>
        <a class="button button-primary" href="profile.html">Go to Profile</a>
      </section>

      <section class="account-summary" aria-labelledby="summary-title">
        <div>
          <p class="eyebrow">Account summary</p>
          <h2 id="summary-title">Your registered details</h2>
        </div>
        <dl class="summary-list">
          <div>
            <dt>Name</dt>
            <dd id="summary-name">-</dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd id="summary-email">-</dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
