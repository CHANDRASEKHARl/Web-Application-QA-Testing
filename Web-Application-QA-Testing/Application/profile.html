<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profile for the Web Application QA Testing Project." />
    <title>Web Application QA Testing Project | Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-page" data-protected-page>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="dashboard.html" aria-label="Web Application QA Testing Project dashboard">
          <span class="brand-mark" aria-hidden="true">QA</span>
          <span>Web Application QA Testing Project</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link active" href="profile.html" aria-current="page">Profile</a>
          <button id="logout-button" class="button button-quiet" type="button">Log out</button>
        </nav>
      </div>
    </header>

    <main class="content-shell profile-shell">
      <section class="page-heading" aria-labelledby="profile-title">
        <p class="eyebrow">Account settings</p>
        <h1 id="profile-title">Profile</h1>
        <p>Keep your profile information up to date.</p>
      </section>

      <section class="profile-form-section" aria-label="Profile details">
        <div id="form-message" class="message" role="alert" aria-live="polite" hidden></div>
        <form id="profile-form" novalidate>
          <div class="form-grid">
            <div class="field-group">
              <label for="profile-name">Name</label>
              <input id="profile-name" name="name" type="text" autocomplete="name" placeholder="Enter your name" />
              <p class="field-error" id="profile-name-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="profile-email">Email</label>
              <input id="profile-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" />
              <p class="field-error" id="profile-email-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter your phone number" />
              <p class="field-error" id="phone-error" aria-live="polite"></p>
            </div>

            <div class="field-group field-group-wide">
              <label for="address">Address</label>
              <textarea id="address" name="address" autocomplete="street-address" rows="4" placeholder="Enter your address"></textarea>
              <p class="field-error" id="address-error" aria-live="polite"></p>
            </div>
          </div>
          <button class="button button-primary" type="submit">Save Profile</button>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
