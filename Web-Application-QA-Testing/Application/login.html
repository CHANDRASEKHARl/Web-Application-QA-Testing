<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to the Web Application QA Testing Project." />
    <title>Web Application QA Testing Project | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="brand-panel" aria-labelledby="app-name">
        <a class="brand" href="index.html" aria-label="Web Application QA Testing Project home">
          <span class="brand-mark" aria-hidden="true">QA</span>
          <span id="app-name">Web Application QA Testing Project</span>
        </a>
        <div class="brand-copy">
          <h1>Welcome back to your test run.</h1>
          <p>Use the account you registered to check the sign-in flow and protected pages.</p>
        </div>
      </section>

      <section class="form-panel" aria-labelledby="login-title">
        <div class="form-intro">
          <p class="eyebrow">Account access</p>
          <h2 id="login-title">Log in</h2>
          <p>Enter your registered email and password.</p>
        </div>

        <div id="form-message" class="message" role="alert" aria-live="polite" hidden></div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" />
            <p class="field-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
            <p class="field-error" id="password-error" aria-live="polite"></p>
          </div>

          <button class="button button-primary" type="submit">Log in</button>
        </form>

        <p class="form-switch">Need an account? <a href="index.html">Register</a></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
